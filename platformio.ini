[platformio]
default_envs = tab5

[env:tab5]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = m5stack-tab5-p4
framework = arduino
board_build.flash_size = 16MB
board_build.partitions = default_16MB.csv
monitor_speed = 115200
upload_speed = 1500000
build_unflags = -std=gnu++11 -std=gnu++2b -std=gnu++23 -std=gnu++20
build_flags =
    -std=gnu++17
    -DPDA_TARGET_TAB5
    -DLV_CONF_INCLUDE_SIMPLE
    -Iinclude
    -DARDUINO_LOOP_STACK_SIZE=32768
    -DCORE_DEBUG_LEVEL=1
lib_deps =
    M5Unified=https://github.com/m5stack/M5Unified/archive/refs/tags/0.2.25.zip
    M5GFX=https://github.com/m5stack/M5GFX/archive/refs/tags/0.2.32.zip
    lvgl/lvgl@8.3.11
